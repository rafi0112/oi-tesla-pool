<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2ECE0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0C0B" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Oi Tesla Pool — one Bullet, three seats, everyone going your way across Dhaka." />
    <title>ওই Tesla Pool</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Galada&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <script>
      // Mirrors ThemeContext's initial-state logic: set data-theme before first
      // paint so there's no flash of the wrong theme while React hydrates.
      (function () {
        try {
          var stored = localStorage.getItem('oi-tesla-theme')
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
